; cameras.example.ini  -  template for cameras.ini
;
;   cp cameras.example.ini cameras.ini      (cameras.ini is git-ignored: passwords stay on this machine)
;   ./nova start                            (Windows: nova start;  ./nova -h lists the commands)
;
; One section per camera.  The section name is the id you type on the command line;
; `name` is the window / recording-folder name (defaults to the id).
; `opts` is appended to the default opts.  `enabled = no` keeps a camera out of `start`.
; Any nova.py option goes into opts: -r (record), -t URL (stream), --ffmpeg "...", --accel ...

[defaults]
; =============================================================================
; Hardware acceleration (--accel)
; =============================================================================
;   (omit)           software decoding - works everywhere, uses the most CPU
;   cuda             NVIDIA: NVDEC/CUVID decode + NVENC encode        Linux, Windows
;   qsv              Intel Quick Sync (integrated / Arc)              Linux, Windows
;   vaapi            Intel/AMD on Linux            (custom FFmpeg build only)
;   videotoolbox     macOS (Apple Silicon / Intel)
;   d3d11va / dxva2  Windows, any GPU, through the standard decoder
;   rkmpp / v4l2m2m  Rockchip / Raspberry Pi boards
;
; Log levels (-l): CRITICAL < ERROR < WARNING < INFO < VERBOSE < DEBUG < TRACE
;
; =============================================================================
; Presets - keep exactly ONE `opts =` line uncommented
; =============================================================================
; Linux, NVIDIA - everyday use (quiet)
opts = --opengl --accel cuda -f 30 -b -l CRITICAL
; Linux, NVIDIA - debugging
; opts = --opengl --accel cuda -f 30 -b -l DEBUG
; Linux, Intel/AMD with a custom FFmpeg build
; opts = --opengl --accel vaapi -f 30 -b -l ERROR
; Windows, Intel Quick Sync
; opts = --opengl --accel qsv -f 30 -b -l ERROR
; Windows, any GPU (Direct3D 11)
; opts = --opengl --accel d3d11va -f 30 -b -l ERROR
; macOS, VideoToolbox
; opts = --opengl --accel videotoolbox -f 30 -l ERROR
; No usable GPU: software decoding, lower display rate to save CPU
; opts = --opengl -f 15 -b -l ERROR
; OpenGL 3.3 not available: QPainter rendering (drop --opengl)
; opts = --accel cuda -f 30 -b -l ERROR
; Record everything from startup, 1-hour files, mono 16 kHz audio
; opts = --opengl --accel cuda -f 30 -b -l CRITICAL -r --record-interval 1h --ffmpeg "-ac 1 -ar 16000"
;
; camera = frontdoor        `nova run` without an id starts this camera
; python = venv/bin/python  interpreter for nova.py (default: the venv next to nova, else the python running cams.py)
; stagger = 0.5             seconds between starts (lets 15 cameras share one GPU init)

[env]
; environment for every camera process
NOVA_TIMEOUT = 10000000
; NOVA_TIMEOUT = 5000000        5 s socket timeout instead of 10 s
; NOVA_GPU_DEVICES = 0,1        two GPUs: nova start deals the cameras over them in turn; opts = --gpu 1 pins a camera
; NOVA_AUDIO_DEVICE_INDEX = 0   force a PortAudio output device (list them with -l TRACE)

[frontdoor]
name = Front door
url = rtsp://admin:password@192.168.1.10:554/stream_0

[yard]
name = Back yard
url = rtsp://192.168.1.11:554/user=admin&password=password&channel=1&stream=0
opts = -r --record-interval 1h

[garage]
name = Garage (ONVIF)
url = onvif://admin:password@192.168.1.12
enabled = no

; brand shortcuts find the RTSP port and path: hik:// dahua:// xmeye:// reolink:// axis:// tapo:// unv://
; (docs/user-guide.md, "Camera brands"); /CHANNEL/STREAM picks a recorder channel and main|sub|third
[driveway]
name = Driveway (Reolink, sub stream)
url = reolink://admin:password@192.168.1.14/sub
enabled = no

[nvr3]
name = NVR channel 3 (Hikvision, main stream)
url = hik://admin:password@192.168.1.2/3/main
enabled = no

[lobby]
name = Lobby, streamed to YouTube
url = rtsp://viewer:password@192.168.1.13:554/av_stream/ch0
opts = -t rtmp://a.rtmp.youtube.com/live2/YOUR-STREAM-KEY --ffmpeg "-b:v 3M -g 60"
enabled = no
