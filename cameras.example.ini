; cameras.example.ini  -  template for cameras.ini
;
;   cp cameras.example.ini cameras.ini      (cameras.ini is git-ignored: passwords stay on this machine)
;   python cams.py list | start | stop | run ID [nova.py args]
;
; One section per camera.  The section name is the id you type on the command line;
; `name` is the window / recording-folder name (defaults to the id).
; `opts` is appended to the default opts.  `enabled = no` keeps a camera out of `start`.
; Any nova.py option goes into opts: -r (record), -t URL (stream), --ffmpeg "...", --accel ...

[defaults]
opts = --opengl --accel cuda -f 30 -b -l WARNING
; camera = frontdoor        ; which camera `cams.py run` uses when no id is given
; python = venv/bin/python  ; interpreter for nova.py (default: the one running cams.py)
; stagger = 0.5             ; seconds between starts

[env]
NOVA_TIMEOUT = 10000000
; NOVA_GPU_DEVICES = 0,1
; NOVA_AUDIO_DEVICE_INDEX = 0

[frontdoor]
name = Front door
url = rtsp://admin:password@192.168.1.10:554/stream_0

[yard]
name = Back yard
url = rtsp://192.168.1.11:554/user=admin&password=password&channel=1&stream=0
opts = -r --record-interval 1h

[garage]
name = Garage (ONVIF)
url = onvif://admin:password@192.168.1.12
enabled = no

[lobby]
name = Lobby, streamed to YouTube
url = rtsp://viewer:password@192.168.1.13:554/av_stream/ch0
opts = -t rtmp://a.rtmp.youtube.com/live2/YOUR-STREAM-KEY --ffmpeg "-b:v 3M -g 60"
enabled = no
