<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Nova</title>
  <!-- Camera windows laid over each other, each its own size: two behind (green, the border of a window
       without the focus) and the focused one in front (orange), which is the camera with its lens.
       The colours are Nova's border colours, brightened for the dark ground.
       This drawing is for 64 px and more; nova-medium.svg and nova-small.svg are the same idea for
       fewer pixels. tools/gen_icon.py renders the PNG files from the three. -->
  <rect width="512" height="512" rx="114" fill="#15171C"/>
  <g transform="translate(51.6 54.4) scale(0.8)" fill="none" stroke-linejoin="round">
    <rect x="37" y="96" width="240" height="150" rx="26" stroke="#1FA83A" stroke-width="26"/>
    <rect x="86" y="232" width="164" height="176" rx="26" fill="#15171C" stroke="#15171C" stroke-width="50"/>
    <rect x="86" y="232" width="164" height="176" rx="26" stroke="#1FA83A" stroke-width="26"/>
    <polygon points="401,228 477,178 477,342 401,292" fill="#15171C" stroke="#15171C" stroke-width="44"/>
    <polygon points="401,228 477,178 477,342 401,292" fill="#F0851A" stroke="#F0851A" stroke-width="20"/>
    <rect x="196" y="170" width="190" height="180" rx="32" fill="#15171C" stroke="#15171C" stroke-width="54"/>
    <rect x="196" y="170" width="190" height="180" rx="32" stroke="#F0851A" stroke-width="30"/>
  </g>
</svg>
