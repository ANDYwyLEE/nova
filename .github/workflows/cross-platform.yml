name: Cross-platform

# Windows and macOS runners: weekly, by hand, and when the dependencies change.
on:
  schedule:
    - cron: "0 3 * * 1"          # Mondays 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/cross-platform.yml

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.13"           # PyAudio has no Windows wheel for 3.14 yet
          - os: macos-latest         # Apple Silicon
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: PortAudio (macOS, PyAudio is built from source; Homebrew only because the runner ships it, the install guide uses MacPorts)
        if: runner.os == 'macOS'
        run: brew install portaudio
      - name: Python dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          CFLAGS: -I/opt/homebrew/include
          LDFLAGS: -L/opt/homebrew/lib
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
      - name: Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
      - name: FFmpeg build inside the av wheel
        shell: python
        run: |
          import av, platform
          from av.codec.hwaccel import hwdevices_available
          print("python", platform.python_version(), platform.platform())
          print("av", av.__version__, "ffmpeg", getattr(av, "ffmpeg_version_info", "?"))
          print("hw devices:", hwdevices_available())
          print("hw codecs:", sorted(n for n in av.codecs_available
                                     if any(k in n for k in ("nvenc", "cuvid", "qsv", "amf", "videotoolbox", "vaapi", "d3d11", "mf"))))
      - name: Launcher help (Windows)
        if: runner.os == 'Windows'
        run: .\nova.bat -h
      - name: Launcher help (macOS)
        if: runner.os == 'macOS'
        run: ./nova -h
      - name: Tests
        run: pytest
