name: PyAudio patch (temporary)

# One-off check of a one-line patch for PyAudio's setup.py (the Visual Studio + vcpkg branch only for a Python
# built with Microsoft's compiler): 0.2.14 as released and patched, built with Microsoft's compiler + vcpkg
# (must come out the same) and in MSYS2's environments (must build at all). Runs on a push to this branch only.
on:
  push:
    branches: [pyaudio-patch-test]

jobs:
  msvc:
    name: Visual Studio + vcpkg (static PortAudio), Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.9"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: PortAudio from vcpkg, statically linked (INSTALL, "Microsoft Windows & VCPKG")
        shell: cmd
        run: |
          "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" install portaudio:x64-windows-static
          dir "%VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib"
      - name: With VCPKG_PATH
        shell: bash
        run: |
          python -m pip install -q setuptools wheel
          export VCPKG_PATH="$(cygpath -w "$VCPKG_INSTALLATION_ROOT")\\installed\\x64-windows-static"
          bash .github/pyaudio/try.sh "$PWD/with-vcpkg" | tee with-vcpkg.txt
          grep -q '^SAME' with-vcpkg.txt && grep -q '^b: imported' with-vcpkg.txt && grep -q '/MT' with-vcpkg/cmds-b.txt
      - name: Without VCPKG_PATH, library named on the command line (INSTALL, "Without VCPKG")
        shell: bash
        run: |
          V="$(cygpath -w "$VCPKG_INSTALLATION_ROOT")\\installed\\x64-windows-static"
          EXTRA="-I $V\\include -L $V\\lib -l portaudio" bash .github/pyaudio/try.sh "$PWD/without" | tee without.txt
          grep -q '^SAME' without.txt && grep -q '^b: imported' without.txt

  msys2:
    name: MSYS2 ${{ matrix.msystem }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { msystem: UCRT64, cc: gcc }
          - { msystem: MINGW64, cc: gcc }
          - { msystem: CLANG64, cc: clang }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
      - name: Compiler, Python and PortAudio from pacman
        run: |
          for i in 1 2 3; do
            pacman -S --needed --noconfirm git ${MINGW_PACKAGE_PREFIX}-{${{ matrix.cc }},python-pip,python-setuptools,python-wheel,portaudio} && break
            [ $i = 3 ] && exit 1; sleep 20
          done
      - name: As released (fails), patched (builds and imports)
        run: |
          bash .github/pyaudio/try.sh "$PWD/try" | tee try.txt
          grep -q '^=== a' try.txt && grep -A1 '^=== a' try.txt | grep -q 'BUILD FAILED'
          grep -q '^b: imported' try.txt
