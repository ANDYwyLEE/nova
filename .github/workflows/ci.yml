name: CI

# Every push: the software paths on Linux (no GPU on the runners). Windows and macOS run from
# cross-platform.yml on a schedule, because their minutes cost 2x and 10x on the free plan.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux, Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries (PortAudio for PyAudio, Qt offscreen runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends portaudio19-dev libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Python dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
      - name: Generated doc tables are current
        run: python docs/gen_keys.py --check
      - name: Launcher help
        run: ./nova -h
      - name: Tests
        run: pytest
