name: Install guide

# docs/install.md, Linux: its commands as they are written, in a distribution image that has nothing
# installed yet (the runners themselves come with a compiler, Python and half of the libraries, so CI
# cannot tell when the guide forgets a package: it had forgotten the compiler PyAudio needs).
# By hand, weekly, and when the guide or the requirements change.
on:
  schedule:
    - cron: "30 3 * * 1"          # Mondays 03:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/install.md
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/install-guide.yml

jobs:
  linux:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04", "debian:13", "fedora:latest"]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v5
      - name: The guide's package line, read from docs/install.md
        run: |
          if command -v apt-get > /dev/null; then apt-get update; tool=apt; else tool=dnf; fi
          line=$(awk -v pat="^ *sudo $tool install" '$0 ~ pat {p=1} p{print} p && !/\\$/{exit}' docs/install.md | sed -e 's/^ *sudo //' -e 's/\\$//' | tr '\n' ' ')
          echo "$line"
          case "$line" in "$tool install -y "*) ;; *) echo "could not read the $tool line from the guide"; exit 1;; esac
          $line
      - name: An ordinary user, as on a desktop
        run: |
          command -v runuser > /dev/null || dnf install -y util-linux > /dev/null
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
      - name: The guide's venv and pip lines
        run: |
          runuser -u tester -- bash -ec '
            python3 --version
            python3 -m venv venv && . venv/bin/activate
            pip install -U pip && pip install -r requirements.txt
            python nova.py --help > /dev/null
            cp cameras.example.ini cameras.ini && chmod 600 cameras.ini
            ./nova -h > /dev/null
            ./nova list
            QT_QPA_PLATFORM=offscreen ./nova doctor'
      - name: A clip read headless and recorded (the wheel's own codecs, no GPU)
        run: |
          runuser -u tester -- bash -ec '
            . venv/bin/activate
            python tools/ci_clip.py clip.mp4
            timeout -s INT 14 python nova.py -i clip.mp4 --headless -r --recording-dir rec --snapshot-dir snap -l INFO > nova.log 2>&1 || true
            grep -E "First frame|AVWriter|saved" nova.log
            python tools/ci_clip.py --check rec'
      - name: A window on a virtual screen (Qt's xcb plugin with the guide's libraries; Xvfb is not part of the guide)
        run: |
          if command -v apt-get > /dev/null; then apt-get install -y xvfb xauth > /dev/null; else dnf install -y xorg-x11-server-Xvfb xauth > /dev/null; fi
          runuser -u tester -- bash -ec '
            . venv/bin/activate
            xvfb-run -a -s "-screen 0 1280x720x24" timeout -s INT 12 python nova.py -i clip.mp4 --snapshot-dir snap -l INFO > win.log 2>&1 || true
            tail -4 win.log
            grep -q "First frame" win.log
            ! grep -qE "Could not load the Qt platform plugin|Traceback|CRITICAL" win.log'
      - name: The tests
        run: |
          runuser -u tester -- bash -ec '
            . venv/bin/activate
            pip install -r requirements-dev.txt
            pytest -q'
